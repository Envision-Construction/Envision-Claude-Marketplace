apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: gke-dispatch-secrets
  namespace: gke-dispatch
spec:
  provider: gcp
  parameters:
    secrets: |
      - resourceName: "projects/claude-mcp-457317/secrets/gsd-claude-oauth-token/versions/latest"
        path: "claude-oauth-token"
      - resourceName: "projects/claude-mcp-457317/secrets/gsd-github-app-private-key/versions/latest"
        path: "github-app-key"
  secretObjects:
  - secretName: gke-dispatch-credentials
    type: Opaque
    data:
    - objectName: claude-oauth-token
      key: CLAUDE_CODE_OAUTH_TOKEN
    - objectName: github-app-key
      key: GITHUB_APP_KEY
